:root {
  --paper: #fbfaf6;
  --navy: #102b4d;
  --muted: #657078;
  --line: #d8d6cc;
  --soft: #e8e5dc;
  --accent: #805207;
  --accent-light: #f4eddd;
  --sage: #426a4e;
  --sage-light: #e6eee7;
  --serif: Cormorant, Georgia, serif;
  color: var(--navy);
  background: var(--paper);
  font-family: Manrope, system-ui, sans-serif;
  font-synthesis: none;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-width: 320px;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button,
a,
label,
input,
textarea {
  touch-action: manipulation;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: default;
  opacity: 0.6;
}
a {
  color: var(--accent);
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 3px solid #2e6b9e;
  outline-offset: 3px;
}
button {
  min-height: 44px;
}
a {
  overflow-wrap: anywhere;
}
h1,
h2,
h3,
p {
  margin-top: 0;
}
p {
  line-height: 1.65;
}
h1,
h2,
h3 {
  font-family: var(--serif);
  font-weight: 500;
}
h1 {
  font-size: 64px;
  line-height: 1;
  letter-spacing: -0.035em;
  margin-bottom: 24px;
}
h2 {
  font-size: 34px;
  line-height: 1.1;
  margin-bottom: 18px;
}
h3 {
  font-size: 27px;
  line-height: 1.15;
  margin-bottom: 10px;
}
.skip {
  position: absolute;
  left: 10px;
  top: -100px;
  z-index: 100;
  background: white;
  padding: 15px;
}
.skip:focus {
  top: 10px;
}
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: 232px;
  padding: 34px 22px;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  background: var(--paper);
  z-index: 5;
  overflow-y: auto;
}
.brand {
  font: 500 32px var(--serif);
  border: 0;
  background: none;
  text-align: left;
  letter-spacing: -0.04em;
}
.brand-rule {
  width: 30px;
  border-top: 2px solid var(--accent);
  margin: 14px 0 30px;
}
.nav {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.nav button {
  position: relative;
  text-align: left;
  background: none;
  border: 0;
  border-radius: 5px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  font-size: 13px;
  font-weight: 700;
}
.nav button:hover,
.nav button.active {
  background: #f2efe7;
}
.nav button.active:before {
  content: "";
  position: absolute;
  left: -22px;
  height: 30px;
  width: 3px;
  background: var(--accent);
}
.nav .symbol {
  font-size: 19px;
  width: 22px;
  text-align: center;
  font-weight: 400;
}
.sidebar-foot {
  margin-top: auto;
  padding-top: 30px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
}
.sidebar-foot strong {
  display: block;
  color: var(--sage);
  font-size: 12px;
}
.divider {
  border-top: 1px solid var(--line);
  margin-top: 14px;
  padding-top: 14px;
}
.main {
  margin-left: 232px;
  padding: 38px 48px 138px;
  max-width: 1680px;
}
.eyebrow {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 18px;
}
.topline {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  margin-bottom: 26px;
}
.demo-label {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 5px;
  font-size: 10px;
  color: var(--muted);
  line-height: 1.6;
}
.demo-label:before {
  content: "";
  width: 6px;
  height: 6px;
  background: var(--sage);
  border-radius: 50%;
  flex-shrink: 0;
}
.quiet-button {
  background: none;
  border: 0;
  color: var(--muted);
  font-size: 11px;
  padding: 8px 0;
}
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(290px, 0.85fr);
  gap: 48px;
}
.heading-rule {
  width: 34px;
  border-top: 2px solid var(--accent);
  margin-bottom: 32px;
}
.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
  margin-bottom: 0;
}
.section-title h2,
.section-title h3 {
  font-family: Manrope, system-ui, sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  margin: 0;
}
.section-title small {
  font-size: 10px;
  color: var(--muted);
}
.agenda-row {
  width: 100%;
  border: 0;
  border-bottom: 1px solid var(--soft);
  background: none;
  display: grid;
  grid-template-columns: 84px 34px minmax(0, 1fr);
  gap: 8px;
  text-align: left;
  padding: 13px 0;
  align-items: center;
}
.agenda-row time {
  font-size: 11px;
  font-weight: 700;
}
.person {
  font-size: 10px;
  color: var(--sage);
  font-weight: 700;
}
.agenda-row strong {
  display: block;
  font-size: 12px;
  line-height: 1.55;
}
.agenda-row small {
  display: block;
  font-size: 10px;
  color: var(--muted);
  line-height: 1.5;
}
.agenda-row:hover,
.row-button:hover {
  background: #f4f1e9;
}
.ahead {
  margin-top: 18px;
  background: #f5f3ec;
  padding: 12px 14px;
  border: 1px solid var(--soft);
  border-radius: 5px;
}
.ahead-label {
  font: 500 22px var(--serif);
  margin-bottom: 2px;
}
.ahead p {
  font-size: 11px;
  margin: 0;
}
.needs {
  padding-top: 89px;
}
.need {
  padding: 16px 0;
  border-bottom: 1px solid var(--soft);
}
.need-title {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 5px;
}
.need p {
  font-size: 11px;
  margin-bottom: 7px;
  color: #3f526b;
}
.need small {
  display: block;
  font-size: 10px;
  color: var(--muted);
  margin-bottom: 3px;
}
.text-button {
  padding: 4px 0;
  min-height: 32px;
  border: 0;
  background: none;
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  text-align: left;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  align-items: center;
}
.need .hide {
  color: var(--muted);
  font-weight: 400;
}
.feature {
  margin-top: 30px;
  padding: 22px 25px;
  background: #eef2e9;
  border: 1px solid #d5dfd1;

}

function validateSnapshot(input) {
  if (!input || typeof input !== "object" || Array.isArray(input))
    throw new Error("Snapshot must be an object.");
  if (input.schemaVersion !== 1 || !["demo", "connected"].includes(input.mode))
    throw new Error("Unsupported snapshot version or mode.");
  if (!timestamp(input.generatedAt))
    throw new Error("A real generatedAt timestamp is required.");
  if (!text(input.timeZone, 100) || !input.timeZone)
    throw new Error("Time zone is required.");
  try {
    new Intl.DateTimeFormat("en", { timeZone: input.timeZone }).format();
  } catch {
    throw new Error("Use a valid IANA time zone.");
  }
  if (
    !Array.isArray(input.sources) ||
    input.sources.length > 100 ||
    !Array.isArray(input.items) ||
    input.items.length > 5000
  )
    throw new Error("Invalid source or item list.");
  const sourceIds = new Set();
  for (const s of input.sources) {
    if (!s || !text(s.id, 100) || !s.id || sourceIds.has(s.id))
      throw new Error("Source IDs must be unique.");
    sourceIds.add(s.id);
    if (
      !text(s.label, 200) ||
      !text(s.detail, 2000) ||
      !SOURCE_STATES.includes(s.state)
    )
      throw new Error("Invalid source fields.");
    for (const key of ["observedAt", "freshUntil", "lastAttemptAt"])
      if (s[key] != null && !timestamp(s[key]))
        throw new Error("Invalid source timestamp.");
    if (
      ["checked", "partial"].includes(s.state) &&
      (!s.observedAt || !s.freshUntil)
    )
      throw new Error(
        "Checked sources require observation and freshness times.",
      );
    if (
      s.observedAt &&
      Date.parse(s.observedAt) > Date.parse(input.generatedAt)
    )
      throw new Error("Observation cannot follow snapshot generation.");
    if (
      s.observedAt &&
      s.freshUntil &&
      Date.parse(s.freshUntil) < Date.parse(s.observedAt)
    )
      throw new Error("Freshness cannot end before the observation.");
  }
  const ids = new Set();
  for (const item of input.items) {
    if (!item || !text(item.id, 200) || !item.id || ids.has(item.id))
      throw new Error("Item IDs must be unique.");
    ids.add(item.id);
    if (!sourceIds.has(item.sourceId) || !itemModules.includes(item.module))
      throw new Error("Item has an unknown source or module.");
    if (!text(item.title, 500) || !text(item.summary, 10000))
      throw new Error("Item needs a title and summary.");
    for (const key of [
      "timeLabel",
      "meta",
      "person",
      "nextAction",
      "unreadLabel",
      "result",
      "details",
      "publishedAt",
    ]) {
      if (own(item, key) && !text(item[key]))
        throw new Error(`Invalid item field: ${key}`);
    }
    for (const key of ["startsAt", "endsAt", "observedAt", "publishedAt"])
      if (item[key] != null && !timestamp(item[key]))
        throw new Error("Invalid item timestamp.");
    if (
      item.observedAt &&
      Date.parse(item.observedAt) > Date.parse(input.generatedAt)
    )
      throw new Error("Item observation cannot follow generation.");
    if (item.url && (!text(item.url, 3000) || !safeUrl(item.url)))
      throw new Error(
        "Source links must use HTTPS without embedded credentials.",
      );
    if (item.module === "needs" && !item.nextAction)
      throw new Error("Needs You items require a concrete next action.");
  }
  // Return a clone so caller mutation cannot change a previously validated object.
  return structuredClone(input);
}

function sourceHealth(source, now = new Date()) {
  if (source.state === "not_connected") return "Not connected";
  if (source.state === "unavailable") return "Unavailable";
  if (!source.observedAt || !source.freshUntil) return "Unverified";
  if (Date.parse(source.observedAt) > +now) return "Unverified";
  if (Date.parse(source.freshUntil) <= +now)
    return source.state === "partial" ? "Stale · partial" : "Stale";
  return source.state === "partial" ? "Partial" : "Checked";
}

function localDate(iso, timeZone) {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone,
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
  }).formatToParts(new Date(iso));
  const read = (type) => parts.find((p) => p.type === type).value;
  return `${read("year")}-${read("month")}-${read("day")}`;
}

function mergeSnapshots(previous, candidate) {
  const before = validateSnapshot(previous),
    next = validateSnapshot(candidate);
  if (before.mode !== next.mode || before.timeZone !== next.timeZone)
    throw new Error("Cannot merge different modes or time zones.");
  const sources = new Map(before.sources.map((s) => [s.id, s]));
  const items = new Map(before.items.map((i) => [i.id, i]));
  for (const s of next.sources) {
    const old = sources.get(s.id);
    if (
      old?.observedAt &&
      s.observedAt &&
      Date.parse(s.observedAt) < Date.parse(old.observedAt)
    )
      throw new Error("Observation would move backwards.");
    if (s.state === "not_connected") continue;
    if (s.state === "unavailable") {
      sources.set(s.id, {
        ...s,
        observedAt: old?.observedAt ?? null,
        freshUntil: old?.freshUntil ?? null,
      });
      continue;
    }
    sources.set(s.id, s);
    if (s.state === "checked")
      for (const [id, item] of items)
        if (item.sourceId === s.id) items.delete(id);
    for (const item of next.items.filter((i) => i.sourceId === s.id)) {
      if (items.has(item.id) && items.get(item.id).sourceId !== item.sourceId)
        throw new Error("Item identity collides across sources.");
      items.set(item.id, item);
    }
  }
  return validateSnapshot({
    ...next,
    sources: [...sources.values()],
    items: [...items.values()],
  });
}

function visibleItems(items, hidden = []) {

    : "";
  openDialog(
    `<div class="eyebrow">${escape(labels[i.module] || "Needs you")}</div><h2>${escape(i.title)}</h2><p class="dialog-body">${escape(i.summary)}</p>${i.details ? `<p class="dialog-body">${escape(i.details)}</p>` : ""}${i.nextAction ? `<p class="dialog-body"><strong>Next action:</strong> ${escape(i.nextAction)}</p><p class="help">This starter prepares context. It does not send, book, or change the source.</p>` : ""}${result}<div class="dialog-meta">${escape(i.meta || "")}<br>Source: ${escape(s.label)} · ${escape(s.state)}<br>Observed: ${escape(i.observedAt || s.observedAt || "Unavailable")}<br>${snapshot.mode === "demo" ? "Fictional example. No live account is connected." : "Imported snapshot. No live account connection is established."}</div>${safeUrl(i.url) ? `<a class="secondary" href="${escape(safeUrl(i.url))}" target="_blank" rel="noopener noreferrer">Open exact source ↗</a>` : ""}`,
  );
}
function preparePrompt(request) {
  const title = state.preferences.hubName;
  const prompt = `I am building ${title} from the Build Your Own Hub starter. Please help with this request: ${request}\n\nMy selected sections: ${state.preferences.modules.map((m) => labels[m]).join(", ")}. The starter is a demonstration; its fictional data is not evidence about my real life. Use my actual preferences and the tools available in this chat. Explain any source you cannot read. Prepare a concrete result and verify it. Do not send, purchase, book, or change an external account unless I authorize that action.`;
  openDialog(
    `<div class="eyebrow">Ready for your assistant</div><h2>A useful starting point.</h2><p class="help">Copy this into your own ChatGPT or Codex with the shared context file. Nothing has been sent.</p><textarea class="prompt-area" id="prepared-prompt" aria-label="Prepared prompt" readonly>${escape(prompt)}</textarea><div class="actions">${button("Copy prompt", 'id="copy-prompt"', "primary")}</div>`,
  );
  document.querySelector("#copy-prompt").onclick = async () => {
    const field = document.querySelector("#prepared-prompt");
    try {
      await navigator.clipboard.writeText(field.value);
      announce("Prompt copied.");
    } catch {
      field.select();
      announce("Select and copy the prompt using your browser.");
    }
  };
}
function editDecision(id) {
  const item = snapshot.items.find((i) => i.id === id);
  openDialog(
    `<div class="eyebrow">Decision · Added by ${escape(item.person)}</div><h2>${escape(item.title)}</h2><p class="dialog-body">${escape(item.summary)}</p><form id="decision-form"><label class="field">What did you decide? Include the owner and next step.<textarea name="outcome" maxlength="3000" required>${escape(state.notes[id] || "")}</textarea></label><label class="help"><input type="checkbox" name="resolved" ${state.resolved.includes(id) ? "checked" : ""}> Mark resolved with this written outcome</label><p class="help">Saved in this browser only. A connected version writes to your chosen shared source.</p><button class="primary">Save decision</button></form>`,
  );
  document.querySelector("#decision-form").onsubmit = (event) => {
    event.preventDefault();
    const form = new FormData(event.target),
      outcome = String(form.get("outcome") || "").trim();
    if (!outcome) {
      announce("Write an outcome before saving or resolving.");
      return;
    }
    const next = structuredClone(state);
    next.notes[id] = outcome;
    next.resolved = next.resolved.filter((x) => x !== id);
    if (form.get("resolved")) next.resolved.push(id);
    if (save(next, "Decision saved in this browser.")) {
      dialog.close();
      render();
    }
  };
}
function download(name, value) {
  const url = URL.createObjectURL(
    new Blob([JSON.stringify(value, null, 2) + "\n"], {
      type: "application/json",
    }),
  );
  const link = document.createElement("a");
  link.href = url;
  link.download = name;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function readJsonFile(file) {
  if (!file) return null;
  if (file.size > 3 * 1024 * 1024)
    throw new Error("Choose a JSON file smaller than 3 MB.");
  return JSON.parse(await file.text());
}
function bind() {
  app.querySelectorAll("[data-page]").forEach(
    (el) =>
      (el.onclick = () => {
        page = el.dataset.page;
        render();
        document.querySelector("#main").focus({ preventScroll: true });
        window.scrollTo(0, 0);
      }),
  );
  app
    .querySelectorAll("[data-open]")
    .forEach((el) => (el.onclick = () => openItem(el.dataset.open)));
  app.querySelectorAll("[data-hide]").forEach(
    (el) =>
      (el.onclick = () => {
        const next = structuredClone(state);
        if (!next.hidden.includes(el.dataset.hide))
          next.hidden.push(el.dataset.hide);
        if (save(next, "Hidden from this Hub. The source is unchanged."))
          render();
      }),
  );
  app.querySelectorAll("[data-restore]").forEach(
    (el) =>
      (el.onclick = () => {
        const next = {
          ...state,
          hidden: state.hidden.filter((id) => id !== el.dataset.restore),
        };
        if (save(next, "Restored to this Hub.")) render();
      }),
  );
  app.querySelectorAll("[data-feedback]").forEach(
    (el) =>
      (el.onclick = () => {
        const next = structuredClone(state);
        if (next.feedback[el.dataset.id] === el.dataset.feedback)
          delete next.feedback[el.dataset.id];
        else next.feedback[el.dataset.id] = el.dataset.feedback;
        if (save(next, "Interest feedback saved locally.")) render();
      }),
  );
  app
    .querySelectorAll("[data-plan]")
    .forEach(
      (el) =>
        (el.onclick = () =>
          preparePrompt(
            `Help me adapt the idea “${snapshot.items.find((i) => i.id === el.dataset.plan).title}” to my real preferences and schedule. Check actual details before suggesting a plan.`,
          )),
    );
  app
    .querySelectorAll("[data-decision]")
    .forEach((el) => (el.onclick = () => editDecision(el.dataset.decision)));
  app.querySelector("[data-about]").onclick = () =>
    openDialog(
      '<div class="eyebrow">Build Your Own Hub · 1.0.0</div><h2>A foundation for your own version.</h2><p class="dialog-body">This starter adapts the design and operating patterns of Craig’s Hub. The supplied people, messages, events, teams, and results are fictional. No accounts are connected and no automations are installed.</p><p class="dialog-body">Use the shared context and source code with your own ChatGPT or Codex. Personalize the design first, then connect and verify one source at a time.</p><p class="help">Preferences and meeting notes remain in this browser. The original kit is meant to be shared; keep your personalized, connected copy private.</p>',
    );
  app.querySelector("#composer").onsubmit = (event) => {
    event.preventDefault();
    preparePrompt(new FormData(event.target).get("request"));
  };
  const pf = app.querySelector("#preferences-form");
  if (pf)
    pf.onsubmit = (event) => {
      event.preventDefault();
      const data = new FormData(pf);
      try {
        const preferences = validatePreferences({
          displayName: data.get("displayName"),
          hubName: data.get("hubName"),
          accent: data.get("accent"),
          modules: ["briefing", ...data.getAll("modules")],
        });
        if (
          save({ ...state, preferences }, "Preferences saved in this browser.")
        )
          render();
      } catch (error) {
        announce(error.message);
      }
    };
  const exportButton = app.querySelector("[data-export]");
  if (exportButton)
    exportButton.onclick = () => {
      const form = new FormData(pf);
      try {
        const preferences = validatePreferences({
          displayName: form.get("displayName"),
          hubName: form.get("hubName"),
          accent: form.get("accent"),
          modules: ["briefing", ...form.getAll("modules")],
        });
        download("hub-demo-preferences.json", {
          schemaVersion: 1,
          ...preferences,
        });
        announce(
          "Preferences exported. Notes and snapshots were not included.",
        );
      } catch (error) {
        announce(error.message);
      }
    };
  const pi = app.querySelector("#preferences-import");
  if (pi)
    pi.onchange = async () => {
      try {
        const data = await readJsonFile(pi.files[0]);
        if (!data) return;
        const preferences = validatePreferences(data);
        if (
          save(
            { ...state, preferences },
            "Demo preferences imported and saved locally.",
          )
        )
          render();
      } catch (error) {
        announce(`Preferences not imported: ${error.message}`);
      }
    };
  const si = app.querySelector("#snapshot-import");
  if (si)
    si.onchange = async () => {
      try {
        const data = await readJsonFile(si.files[0]);
        if (!data) return;
        snapshot = validateSnapshot(data);
        imported = true;
        render();
        announce(
          "Snapshot imported for this page only. No live connection was created.",
        );
      } catch (error) {
        announce(`Snapshot not imported: ${error.message}`);
      }
    };
  const reload = app.querySelector("[data-reload]");
  if (reload)
    reload.onclick = async () => {
      try {
        snapshot = await loadSnapshot();
        imported = false;
        render();
        announce(
          "Original fictional snapshot reloaded. Observation times are unchanged.",
        );
      } catch (error) {
        announce(error.message);
      }
    };
}
async function loadSnapshot() {
  if (globalThis.HUB_DEMO_SNAPSHOT)
    return validateSnapshot(globalThis.HUB_DEMO_SNAPSHOT);
  const response = await fetch("/fixtures/demo.json");
  if (!response.ok) throw new Error("Example snapshot could not be loaded.");
  return validateSnapshot(await response.json());
}
try {
  snapshot = await loadSnapshot();
  loadState();
  render();
  if (persistenceWarning) announce(persistenceWarning);
} catch (error) {
  app.innerHTML = `<main class="fatal"><h1>The example could not load.</h1><p>${escape(error.message)}</p><p>Open preview.html for the self-contained version, or run npm start from the extracted project folder.</p></main>`;
}
</script>
</body>
</html>
