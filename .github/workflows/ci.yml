name: Starter checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run build
      - run: npm run verify
      - name: Check generated files are current
        run: git diff --exit-code -- preview.html index.html SHARED-CONTEXT.md
